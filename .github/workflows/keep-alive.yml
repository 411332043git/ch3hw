# 每 2～3 天對 Supabase 敲一次門，避免免費專案因閒置被暫停（架構文件 9.4）
# 只用公開的 Project URL 與 Publishable key，放在 repo 的 Settings → Secrets and variables → Actions → Variables
name: keep-alive

on:
  schedule:
    - cron: '23 4 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          test "$code" = "200"
