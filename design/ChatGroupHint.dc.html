<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>好多人聊天室</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="macaron.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div class="app theme-{{theme}}">

  <div class="tabs" role="tablist" aria-label="聊天室">
    <button class="tab-toggle" aria-expanded="false" aria-label="展開：好多人、12 人在線、換暱稱"><span class="ico sm i-down"></span></button>
    <button class="tab on" role="tab" aria-selected="true"><span class="ico sm i-users"></span>好多人</button>
    <a class="tab" role="tab" aria-selected="false" href="ChatDm.dc.html" style="text-decoration: none;"><span class="ico sm i-lock"></span>兩個人<span class="pip"></span></a>
  </div>
  <div class="announce-row"><button class="flower-btn" aria-label="公告紀錄：曾經設為公告的訊息"><span class="flower"></span></button></div>

  <div class="msgs" style="justify-content: flex-end;">
    <span class="sys">布丁 進來了</span>

    <div class="msg">
      <span class="av sm a2"><i class="an an-rabbit"></i></span>
      <div class="stack">
        <div class="meta"><b>麻糬</b><span>09:31</span></div>
        <div class="bubble">大家早安～今天天氣好好</div>
        <div class="rx-row"><span class="rx-stack" role="group" aria-label="表情回應"><button class="rxe on" aria-label="👍 2 人"><span class="e">👍</span></button><button class="rxe" aria-label="❤️ 1 人"><span class="e">❤️</span></button><button class="rxe" aria-label="🎉 1 人"><span class="e">🎉</span></button></span><button class="rx-add" aria-label="選別的表情"><span class="ico sm i-plus"></span></button></div>
      </div>
    </div>

    <div class="msg">
      <span class="av sm a6"><i class="an an-cat"></i></span>
      <div class="stack">
        <div class="meta"><b>布丁</b><span>09:33</span></div>
        <div class="bubble">
          看我拍到的！
          <span class="pic" style="width: 190px; height: 112px;"><span class="zoom"><span class="ico sm i-search"></span></span></span>
        </div>
        <div class="rx-row"><span class="rx-stack" role="group" aria-label="表情回應"><button class="rxe" aria-label="❤️ 3 人"><span class="e">❤️</span></button><button class="rxe on" aria-label="✨ 1 人"><span class="e">✨</span></button></span><button class="rx-add" aria-label="選別的表情"><span class="ico sm i-plus"></span></button></div>
      </div>
    </div>

    <div class="msg">
      <span class="av sm a2"><i class="an an-rabbit"></i></span>
      <div class="stack">
        <div class="meta"><b>麻糬</b><span>昨天 08:50</span></div>
        <div class="bubble voice expired"><button class="vplay" disabled aria-label="語音已過期"><span class="ico sm i-play"></span></button><span class="wave" aria-hidden="true"><i style="height: 8px;"></i><i style="height: 14px;"></i><i style="height: 10px;"></i><i style="height: 18px;"></i><i style="height: 12px;"></i><i style="height: 22px;"></i><i style="height: 16px;"></i><i style="height: 10px;"></i><i style="height: 20px;"></i><i style="height: 14px;"></i><i style="height: 8px;"></i><i style="height: 18px;"></i><i style="height: 12px;"></i><i style="height: 16px;"></i><i style="height: 10px;"></i><i style="height: 14px;"></i><i style="height: 8px;"></i><i style="height: 12px;"></i></span><span class="vtime">已過期</span></div>
      </div>
    </div>

    <div class="msg">
      <span class="av sm a6"><i class="an an-giraffe"></i></span>
      <div class="stack">
        <div class="meta"><b>小雲</b><span>09:34</span></div>
        <div class="bubble voice"><button class="vplay" aria-label="播放語音，12 秒"><span class="ico sm i-play"></span></button><span class="wave" aria-hidden="true"><i style="height: 8px;"></i><i style="height: 14px;"></i><i style="height: 10px;"></i><i style="height: 18px;"></i><i style="height: 12px;"></i><i style="height: 22px;"></i><i style="height: 16px;"></i><i style="height: 10px;"></i><i style="height: 20px;"></i><i style="height: 14px;"></i><i style="height: 8px;"></i><i style="height: 18px;"></i><i style="height: 12px;"></i><i style="height: 16px;"></i><i style="height: 10px;"></i><i style="height: 14px;"></i><i style="height: 8px;"></i><i style="height: 12px;"></i></span><span class="vtime">0:12</span></div>
      </div>
    </div>

    <div class="msg me">
      <div class="stack">
        <div class="meta"><span>09:35</span><b>小米</b></div>
        <div class="bubble">好可愛！我也想去～</div>
        <div class="rx-row"><span class="rx-stack" role="group" aria-label="表情回應"><button class="rxe" aria-label="🥺 1 人"><span class="e">🥺</span></button></span><button class="rx-add" aria-label="選別的表情"><span class="ico sm i-plus"></span></button></div>
      </div>
      <span class="av sm a1"><i class="an an-bear"></i></span>
    </div>

    <button class="sys recall" aria-label="收回的訊息，長按可以復原">收回</button>
  </div>

  <button class="btn sm newbtn"><span class="ico sm i-down"></span>3 則新訊息</button>

  <span class="tip mt" role="status">長按藍色鈕可以說話</span>

  <div class="composer">
    <div class="line">
      <button class="btn-ico c-blue" aria-label="長按說話，最長 60 秒"><span class="ico i-mic"></span></button>
      <button class="btn-ico c-yellow" aria-label="傳圖片"><span class="ico i-image"></span></button>
      <div class="textarea ph"><span class="grow">說話！</span><button class="in-emoji" aria-label="Emoji 表情"><span class="ico sm i-smile"></span></button></div>
      <button class="btn-ico c-pink send" aria-label="送出"><span class="ico i-send"></span></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["pink","night"],"default":"pink","section":"主題"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'pink' };
  }
}
</script>
</body>
</html>
