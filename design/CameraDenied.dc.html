<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>頭像相機視窗</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="macaron.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div class="app theme-{{theme}}">
  <div class="row gap8" style="padding: 14px 16px 0;">
    <a class="btn-ico" href="DmNew.dc.html" aria-label="取消" style="text-decoration: none;"><span class="ico i-x"></span></a>
    <h1 class="h2 grow" style="text-align: center;">拍一張頭像</h1>
    <span style="width: 46px;"></span>
  </div>

  <div class="cam light" style="margin: 38px 16px 0; height: 420px;" role="img" aria-label="相機沒有開啟">
    <div class="col" style="position: absolute; inset: 0; align-items: center; justify-content: center; gap: 12px; padding: 0 30px; text-align: center;">
      <span class="ico lg i-camera" style="opacity: .55;"></span>
      <span class="bold">你沒有允許使用相機</span>
      <span class="small muted">網頁沒辦法直接幫你打開設定，要請你自己允許一下：</span>
      <ol class="small" style="text-align: left; margin: 0; padding-left: 20px; line-height: 1.7;"><li>點網址列左邊的小鎖頭（或設定圖示）</li><li>找到「相機」，改成「允許」</li><li>回到這裡按「再試一次」</li></ol>
      <button class="btn sm"><span class="ico sm i-camera"></span>再試一次</button>
    </div>
  </div>

  <div class="row" style="justify-content: space-between; padding: 22px 34px 0;">
    <button class="btn-ico" aria-label="切換鏡頭" disabled style="opacity: .45;"><span class="ico i-flip"></span></button>
    <button class="shutter" aria-label="拍照（相機沒有開啟）" disabled style="opacity: .45;"><span class="ico lg i-camera"></span></button>
    <span style="width: 46px;" aria-hidden="true"></span>
  </div>

  <div style="padding: 26px 16px 0;">
    <a class="btn yellow block" href="Cropper.dc.html" style="min-height: 64px; font-size: 18px; text-decoration: none;"><span class="ico i-image"></span>選擇相簿</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["pink","night"],"default":"pink","section":"主題"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'pink' };
  }
}
</script>
</body>
</html>
