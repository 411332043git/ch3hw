<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>圖片放大檢視</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="macaron.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div class="app theme-{{theme}}" style="overflow: hidden;">

    <div class="blur-bg" aria-hidden="true">
    <div class="msg"><span class="av sm a6"><i class="an an-cat"></i></span><div class="stack"><div class="meta"><b>布丁</b><span>09:33</span></div><div class="bubble">下午要不要一起去公園？</div></div></div>
    <div class="msg"><span class="av sm a2"><i class="an an-rabbit"></i></span><div class="stack"><div class="meta"><b>麻糬</b><span>09:35</span></div><div class="bubble">下午兩點在公園集合！</div></div></div>
    <div class="msg me"><div class="stack"><div class="meta"><span>09:36</span><b>小米</b></div><div class="bubble">好可愛！我也想去～</div></div><span class="av sm a1"><i class="an an-bear"></i></span></div>
    <div class="msg"><span class="av sm a6"><i class="an an-giraffe"></i></span><div class="stack"><div class="meta"><b>小雲</b><span>09:38</span></div><div class="bubble">我帶點心～</div></div></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(74, 54, 42, .5);"></div>

  <div class="row gap8" style="padding: 14px 16px 0; position: relative; z-index: 2;">
    <div class="row gap8 grow" style="min-width: 0;">
      <span class="av sm a6"><i class="an an-cat"></i></span>
      <div class="col" style="min-width: 0;">
        <span class="bold nowrap" style="color: #FFF8EE;">布丁</span>
        <span class="tiny" style="color: #E9D8C8;">09:33</span>
      </div>
    </div>
    <button class="btn-ico" aria-label="關閉（也可以按 Esc 或點圖片外面）"><span class="ico i-x"></span></button>
  </div>

  <div class="grow row" style="justify-content: center; padding: 18px 14px; position: relative; z-index: 2;">
    <div class="pic" style="width: 100%; height: 100%; max-height: 520px; border-radius: 28px; border: 4px solid #FFFDF9; box-shadow: 0 24px 40px -14px rgba(0, 0, 0, .55);" role="img" aria-label="放大的圖片"></div>
  </div>

  <div class="row" style="justify-content: space-between; align-items: center; gap: 10px; padding: 0 16px 24px; position: relative; z-index: 2;">
    <span class="tiny" style="color: #E9D8C8;">點圖片外面或按 ✕ 關閉</span>
    <button class="btn sm" aria-label="儲存到裝置"><span class="ico sm i-download"></span>儲存</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["pink","night"],"default":"pink","section":"主題"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'pink' };
  }
}
</script>
</body>
</html>
