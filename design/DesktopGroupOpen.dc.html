<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>電腦：好多人</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="macaron.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div class="app wide theme-{{theme}}" style="flex-direction: row; gap: 20px; padding: 20px 28px; align-items: stretch;">

  <aside class="card col" style="width: 260px; flex: none; padding: 16px; gap: 10px; border-radius: 30px;" aria-label="在線名單">
    <div class="row gap8"><span class="h2 grow">在線名單</span><span class="chip mint"><span class="dot"></span>12 人</span><button class="btn-ico flat sm" aria-label="收起在線名單"><span class="ico sm i-left"></span></button></div>
    <div class="row gap10" style="gap: 10px; min-height: 46px; padding: 0 8px; border-radius: 18px; background: var(--accent-soft);"><span class="av sm a1 me-ring"><i class="an an-bear"></i></span><span class="bold grow">小米（我）</span></div>
    <div class="row" style="gap: 10px; min-height: 42px; padding: 0 8px;"><span class="av sm a2"><i class="an an-rabbit"></i></span><span class="bold grow">麻糬</span><span class="dot"></span></div>
    <div class="row" style="gap: 10px; min-height: 42px; padding: 0 8px;"><span class="av sm a6"><i class="an an-cat"></i></span><span class="bold grow">布丁</span><span class="dot"></span></div>
    <div class="row" style="gap: 10px; min-height: 42px; padding: 0 8px;"><span class="av sm a6"><i class="an an-giraffe"></i></span><span class="bold grow">小雲</span><span class="dot"></span></div>
    <div class="row" style="gap: 10px; min-height: 42px; padding: 0 8px;"><span class="av sm a7"><i class="an an-tiger"></i></span><span class="bold grow">阿狐</span><span class="dot"></span></div>
    <div class="row" style="gap: 10px; min-height: 42px; padding: 0 8px;"><span class="av sm a4"><i class="an an-dog"></i></span><span class="bold grow">小白</span><span class="dot"></span></div>
    <span class="tiny muted" style="padding: 0 8px;">…還有 6 位</span>
    <div class="grow"></div>
  </aside>

  <section class="col grow" style="min-width: 0; max-width: 760px; margin: 0 auto; border-radius: 30px; overflow: hidden; background: rgba(255, 253, 249, .6); border: 2px solid var(--line); box-shadow: var(--shadow);" aria-label="好多人聊天室">
    <div class="tabs" role="tablist" aria-label="聊天室">
      <button class="tab-toggle open" aria-expanded="true" aria-label="收起"><span class="ico sm i-up"></span></button>
      <button class="tab on" role="tab" aria-selected="true"><span class="ico sm i-users"></span>好多人</button>
      <button class="tab" role="tab" aria-selected="false"><span class="ico sm i-lock"></span>兩個人</button>
    </div>

    <div class="topbar" style="margin: 8px 14px 0; background: #E6F7EE; border-color: #BFE6D3; border-radius: 0 0 28px 28px;">
      <div class="col grow"><h1 class="h2" style="font-size: 21px;">好多人</h1><span class="row gap6 small bold"><span class="dot"></span>12 人在線</span></div>
      <a class="btn xs ghost" href="JoinGroup.dc.html" style="text-decoration: none;">換暱稱</a>
      <button class="btn-ico sm" aria-label="選單"><span class="ico i-more"></span></button>
    </div>

    <div class="msgs" style="justify-content: flex-end; padding: 14px 22px 8px;">
      <span class="sys">布丁 進來了</span>
      <div class="msg">
        <span class="av sm a2"><i class="an an-rabbit"></i></span>
        <div class="stack" style="max-width: 62%;">
          <div class="meta"><b>麻糬</b><span>09:31</span></div>
          <div class="bubble">大家早安～今天天氣好好</div>
          <div class="rx-row"><span class="rx-stack" role="group" aria-label="表情回應"><button class="rxe on" aria-label="👍 2 人"><span class="e">👍</span></button><button class="rxe" aria-label="❤️ 1 人"><span class="e">❤️</span></button></span><button class="rx-add" aria-label="選別的表情"><span class="ico sm i-plus"></span></button></div>
        </div>
      </div>
      <div class="msg">
        <span class="av sm a6"><i class="an an-cat"></i></span>
        <div class="stack" style="max-width: 62%;">
          <div class="meta"><b>布丁</b><span>09:33</span></div>
          <div class="bubble">看我拍到的！<span class="pic" style="width: 240px; height: 140px;"><span class="zoom"><span class="ico sm i-search"></span></span></span></div>
          <div class="rx-row"><span class="rx-stack" role="group" aria-label="表情回應"><button class="rxe" aria-label="❤️ 3 人"><span class="e">❤️</span></button></span><button class="rx-add" aria-label="選別的表情"><span class="ico sm i-plus"></span></button></div>
        </div>
      </div>
      <div class="msg me">
        <div class="stack" style="max-width: 62%;">
          <div class="meta"><span>09:35</span><b>小米</b></div>
          <div class="bubble">好可愛！我也想去～</div>
        </div>
        <span class="av sm a1"><i class="an an-bear"></i></span>
      </div>
    </div>

    <div class="composer" style="border-radius: 0; padding: 12px 18px 16px;">
      <div class="line">
        <button class="btn-ico c-blue" aria-label="長按說話，最長 60 秒"><span class="ico i-mic"></span></button>
        <button class="btn-ico c-yellow" aria-label="傳圖片"><span class="ico i-image"></span></button>
        <div class="textarea ph"><span class="grow">說話！（Enter 送出，Shift + Enter 換行）</span><button class="in-emoji" aria-label="Emoji 表情"><span class="ico sm i-smile"></span></button></div>
        <button class="btn c-pinkbtn" style="min-height: 50px;"><span class="ico sm i-send"></span>送出</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["pink","night"],"default":"pink","section":"主題"},"$preview":{"width":1180,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'pink' };
  }
}
</script>
</body>
</html>
