<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>長按訊息</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="macaron.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
body { margin: 0; }
</style>
</helmet>
<div class="app theme-{{theme}}">

  <div class="tabs" role="tablist" aria-label="聊天室">
    <button class="tab-toggle" aria-expanded="false" aria-label="展開：好多人、12 人在線、換暱稱"><span class="ico sm i-down"></span></button>
    <button class="tab on" role="tab" aria-selected="true"><span class="ico sm i-users"></span>好多人</button>
    <a class="tab" role="tab" aria-selected="false" href="ChatDm.dc.html" style="text-decoration: none;"><span class="ico sm i-lock"></span>兩個人</a>
  </div>
  <div class="announce-row"><button class="flower-btn" aria-label="公告紀錄：曾經設為公告的訊息"><span class="flower"></span></button></div>

  <div class="msgs" style="justify-content: flex-end; gap: 14px;">
    <div class="msg">
      <span class="av sm a3"><i class="an an-cat"></i></span>
      <div class="stack">
        <div class="meta"><b>布丁</b><span>09:33</span></div>
        <div class="bubble">好～我帶點心</div>
      </div>
    </div>

    <div class="msg" style="position: relative; z-index: 6;">
      <span class="av sm a2"><i class="an an-rabbit"></i></span>
      <div class="stack">
        <div class="meta"><b>麻糬</b><span>09:35</span></div>
        <div class="bubble" style="box-shadow: 0 0 0 4px var(--accent), var(--shadow-soft);">下午兩點在公園集合，記得帶水！</div>
        <div class="card row gap6" style="margin-top: 8px; padding: 6px 8px; border-radius: 22px; align-self: flex-start;" role="menu" aria-label="這則訊息">
          <button class="btn xs" role="menuitem" ><span class="flower line" style="width: 18px; height: 18px;"></span>設為公告</button>
        </div>
      </div>
    </div>

    <div class="msg me" style="position: relative; z-index: 6;">
      <div class="stack">
        <div class="meta"><span>09:36</span><b>小米</b></div>
        <div class="bubble" style="box-shadow: 0 0 0 4px var(--accent), var(--shadow-soft);">好可愛！我也想去～</div>
        <div class="card row gap6" style="margin-top: 8px; padding: 6px 8px; border-radius: 22px; align-self: flex-end;" role="menu" aria-label="自己的這則訊息">
          <button class="btn xs ghost" role="menuitem"><span class="ico sm i-trash"></span>收回</button>
          <button class="btn xs" role="menuitem" ><span class="flower line" style="width: 18px; height: 18px;"></span>設為公告</button>
        </div>
      </div>
      <span class="av sm a1"><i class="an an-crab"></i></span>
    </div>
  </div>

  <div class="composer">
    <div class="line">
      <button class="btn-ico c-blue" aria-label="長按說話，最長 60 秒"><span class="ico i-mic"></span></button>
      <button class="btn-ico c-yellow" aria-label="傳圖片"><span class="ico i-image"></span></button>
      <div class="textarea ph"><span class="grow">說話！</span><button class="in-emoji" aria-label="Emoji 表情"><span class="ico sm i-smile"></span></button></div>
      <button class="btn-ico c-pink send" aria-label="送出"><span class="ico i-send"></span></button>
    </div>
  </div>

  <div class="scrim" style="z-index: 5; background: rgba(91, 66, 52, .26);"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["pink","night"],"default":"pink","section":"主題"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.theme ?? 'pink' };
  }
}
</script>
</body>
</html>
