try {
  var t = localStorage.getItem('ch3hw.theme');
  var th = t === 'night' ? 'night' : 'macaron';
  document.documentElement.setAttribute('data-theme', th);
  document.documentElement.className = 'theme-' + th;
} catch (e) { document.documentElement.setAttribute('data-theme', 'macaron'); document.documentElement.className = 'theme-macaron'; }
</script>
